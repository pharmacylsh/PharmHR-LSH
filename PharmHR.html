// ==== js\remote-sync.js ====
// Optional cross-device sync via Supabase (Postgres). Only activates when
// SUPABASE_ENABLED is true and SUPABASE_URL/SUPABASE_ANON_KEY (see
// supabase-config.js) are filled in — otherwise every function here is a harmless
// no-op and the app keeps using only this browser's local storage, exactly like before.
//
// Model: the whole shared slice of app state lives in ONE row (id = "shared") of the
// `pharmhr_state` table, as a single jsonb column. Every device that changes
// something upserts that row; every device subscribes to Postgres changes on it and
// applies whatever it now holds. That means it's last-write-wins — fine for a small
// internal team, but two people editing the exact same moment can have one edit
// overwrite the other.
const RemoteSync = (() => {
  const TABLE = "pharmhr_state";
  const ROW_ID = "shared";
  let client = null;
  let lastPushedRev = null;

  function isConfigured() {
    return typeof SUPABASE_ENABLED !== "undefined" && SUPABASE_ENABLED
      && typeof SUPABASE_URL !== "undefined" && SUPABASE_URL
      && typeof SUPABASE_ANON_KEY !== "undefined" && SUPABASE_ANON_KEY
      && typeof supabase !== "undefined";
  }

  async function ensureSignedIn() {
    const { data } = await client.auth.getSession();
    if (data && data.session) return;
    const { error } = await client.auth.signInAnonymously();
    if (error) console.warn("PharmHR sync: anonymous sign-in failed", error);
  }

  function init(onRemoteState) {
    if (!isConfigured()) return false;
    try {
      client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      ensureSignedIn().then(() => {
        // Initial read, in case the row already exists before our subscription below
        // starts receiving change events.
        client.from(TABLE).select("state, rev").eq("id", ROW_ID).maybeSingle()
          .then(({ data, error }) => {
            if (error) { console.warn("PharmHR sync: initial fetch failed", error); return; }
            if (data && data.state) onRemoteState(data.state);
          });

        client.channel("pharmhr-state-changes")
          .on("postgres_changes", { event: "*", schema: "public", table: TABLE, filter: "id=eq." + ROW_ID }, payload => {
            const row = payload.new;
            if (!row || !row.state) return;
            if (row.rev && row.rev === lastPushedRev) return; // echo of our own write
            onRemoteState(row.state);
          })
          .subscribe();
      }).catch(e => console.warn("PharmHR sync: setup failed", e));
      return true;
    } catch (e) {
      console.warn("PharmHR sync: init failed, staying in local-only mode", e);
      return false;
    }
  }

  function push(state) {
    if (!client) return;
    const rev = Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    lastPushedRev = rev;
    client.from(TABLE).upsert({ id: ROW_ID, state, rev, updated_at: new Date().toISOString() })
      .then(({ error }) => { if (error) console.warn("PharmHR sync: push failed", error); });
  }

  // Uploads a file to the "attachments" storage bucket (see SETUP-SYNC.md) and
  // returns its public URL, or null if sync isn't configured / the upload failed —
  // callers fall back to just remembering the filename in that case.
  async function uploadFile(file) {
    if (!client) return null;
    try {
      const path = Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "-" + file.name.replace(/[^a-zA-Z0-9.\-_]/g, "_");
      const { error } = await client.storage.from("attachments").upload(path, file);
      if (error) { console.warn("PharmHR sync: file upload failed", error); return null; }
      const { data } = client.storage.from("attachments").getPublicUrl(path);
      return (data && data.publicUrl) || null;
    } catch (e) {
      console.warn("PharmHR sync: file upload failed", e);
      return null;
    }
  }

  return { init, push, uploadFile };
})();

// ==== js\model.js ====
// Pure helper functions + the "build people" derivation. Courses/talks/research/IDP/
// tags/aspirations are read from real per-person records in state (added through the
// app), NOT fabricated — this deployment records real data, not mockup demo data.
const Model = (() => {

  function ini(name) {
    const n = name.replace(/^(ภญ\.|ภก\.|จพ\.|น\.ส\.|นาง|นาย)/, "");
    const p = n.trim().split(" ");
    return (p[0] || "").slice(0, 2);
  }

  function stageIdx(pos) {
    if (pos.indexOf("เชี่ยวชาญ") >= 0) return 3;
    if (pos.indexOf("ชำนาญการพิเศษ") >= 0 || pos.indexOf("อาวุโส") >= 0) return 2;
    if (pos.indexOf("ชำนาญการ") >= 0) return 1;
    return 0;
  }

  function stageName(i) {
    return ["ระดับปฏิบัติการ", "ระดับชำนาญการ", "ระดับชำนาญการพิเศษ", "ระดับเชี่ยวชาญ"][i];
  }

  // Roster sort order: เภสัชกร* first, then เจ้าพนักงานเภสัชกรรม*, everything else last.
  function positionGroup(pos) {
    if (pos.indexOf("เภสัชกร") === 0) return 0;
    if (pos.indexOf("เจ้าพนักงานเภสัชกรรม") === 0) return 1;
    return 2;
  }
  function sortPeople(list) {
    return list.slice().sort((a, b) =>
      positionGroup(a.pos) - positionGroup(b.pos) ||
      a.stageIdx - b.stageIdx ||
      a.name.localeCompare(b.name, "th")
    );
  }

  function hash(i, s) {
    return (i * 37 + s * 101 + i * i * 7) % 1000;
  }

  function thDate(iso) {
    const d = new Date(iso);
    return d.getDate() + " " + TH_M[d.getMonth()] + " " + (d.getFullYear() + 543);
  }

  function tenure(iso) {
    const s = new Date(iso), e = new Date(2026, 7, 26);
    let m = (e.getFullYear() - s.getFullYear()) * 12 + (e.getMonth() - s.getMonth());
    if (e.getDate() < s.getDate()) m -= 1;
    const y = Math.floor(m / 12), r = m % 12;
    return y + " ปี" + (r ? " " + r + " เดือน" : "");
  }

  function kpiOf(hours, talks, research, prog) {
    const sc = (hours / 40) * 45 + Math.min(talks, 4) * 6 + Math.min(research, 3) * 7 + prog * 0.15;
    if (sc >= 68) return ["ดีเยี่ยม", "background:#e3f1ee;color:#0a4f43"];
    if (sc >= 52) return ["ดี", "background:#e6eef7;color:#2a5f8f"];
    if (sc >= 38) return ["พอใช้", "background:#fdf1e0;color:#8a5310"];
    return ["ต้องพัฒนา", "background:#fbe9e7;color:#8f231b"];
  }

  function trackShortLabel(name) {
    return name.replace(" (IV Admixture)", " · IV").replace(" (Chemotherapy)", " · Chemo").replace("Pharmaceutical ", "").replace("Pharmacy ", "");
  }

  function getTracks(state) { return (state && state.tracks) || TRACKS; }

  // Real per-day attendance/leave history: state.daily = { [dateISO]: { [personId]: status } }.
  const LEAVE_STATUSES = ["vacation", "sick", "personal", "late", "trip"];
  function countLeave(state, personId) {
    const daily = state.daily || {};
    const counts = { vacation: 0, sick: 0, personal: 0, late: 0, trip: 0 };
    Object.keys(daily).forEach(dateKey => {
      const status = (daily[dateKey] || {})[personId];
      if (LEAVE_STATUSES.indexOf(status) >= 0) counts[status]++;
    });
    return counts;
  }

  let cache = null, cacheN = -1;

  function build(state) {
    const raw = RAW.concat(state.newPersons || []);
    if (cache && cacheN === raw.length) return cache;
    cacheN = raw.length;
    const deletedSet = new Set(state.deletedIds || []);
    const tracks = getTracks(state);
    const TG = state.targets || DEF_TARGETS;
    const coursesBy = state.coursesByPerson || {};
    const talksBy = state.talksByPerson || {};
    const researchBy = state.researchByPerson || {};
    const idpBy = state.idpByPerson || {};
    const tagsBy = state.tagsByPerson || {};
    const aspireBy = state.aspireByPerson || {};

    cache = raw.map((r, i) => {
      const [name, pos, ti, sub, start, emp] = r;
      const tr = tracks[ti] || tracks[0] || ["-", "-", "#5c6b67"];
      const si = stageIdx(pos);
      const yr = 2026 - new Date(start).getFullYear();

      const courses = (coursesBy[i] || []).slice();

// ==== js\store.js ====
// Central mutable state. Everything persists to this browser's local storage; the
// SHARED_KEYS subset also syncs through RemoteSync (Supabase) when that's configured,
// so multiple computers can see the same roster/records — see remote-sync.js.
const Store = (() => {
  const STORAGE_KEY = "pharmhr.state.v1";

  const defaults = () => ({
    auth: false, loginRole: "chief", loginId: "", loginPw: "", loginErr: false, loginErrMsg: "", remember: true,
    forgotOpen: false, forgotId: "", forgotPw1: "", forgotPw2: "", forgotMsg: "",
    currentUserId: null,
    newPersons: [], deletedIds: [], confList: null, apprList: [], alumniList: [], targets: null, tracks: null,
    admSaved: "", users: null, admQ: "",
    role: "chief", page: "dash", tab: "overview", sel: 0, month: 7, reportMonth: "2026-08",
    q: "", track: "ทุก Career Path", idpFilter: "ทั้งหมด",
    coursesByPerson: {}, talksByPerson: {}, researchByPerson: {}, idpByPerson: {},
    tagsByPerson: {}, aspireByPerson: {}, savedMsg: "",
    conf: {}, daily: {}, dailySavedDates: {}, dailyDate: "2026-08-26",
    modal: null, form: {}, __contextPersonId: null
  });

  // Saved to this browser only (which page you're on, what's selected, open modals,
  // your own login session). Never pushed to or overwritten by other devices.
  const SESSION_KEYS = [
    "auth", "loginRole", "remember", "currentUserId",
    "role", "page", "tab", "sel", "month", "reportMonth", "q", "track", "idpFilter", "admQ", "dailyDate"
  ];

  // The actual data: rosters, accounts, records — this is what should look the same
  // on every computer, so it's the part that syncs through RemoteSync.
  const SHARED_KEYS = [
    "newPersons", "deletedIds", "confList", "apprList", "alumniList", "targets", "tracks", "users",
    "coursesByPerson", "talksByPerson", "researchByPerson", "idpByPerson", "tagsByPerson", "aspireByPerson",
    "conf", "daily", "dailySavedDates"
  ];

  const PERSIST_KEYS = SESSION_KEYS.concat(SHARED_KEYS);

  let state = defaults();
  let renderCb = null;

  // A browser that saved a `users` list before accounts had passwords (or before this
  // deployment's real accounts existed) would otherwise shadow DEFAULT_USERS forever
  // and lock everyone out. Discard that stale list so it falls back to the current
  // defaults; anything an admin has actually re-saved since then already has a
  // password and survives.
  function migrate(saved) {
    if (saved && Array.isArray(saved.users) && saved.users.some(u => typeof u.password !== "string")) {
      saved.users = null;
    }
    return saved;
  }

  function pick(keys, obj) {
    const out = {};
    keys.forEach(k => out[k] = obj[k]);
    return out;
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const saved = migrate(JSON.parse(raw));
        state = Object.assign(defaults(), saved);
      }
    } catch (e) {
      console.warn("PharmHR: could not read saved state", e);
    }
  }

  function persistLocal() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(pick(PERSIST_KEYS, state)));
    } catch (e) {
      console.warn("PharmHR: could not save state", e);
    }
  }

  function onChange(cb) { renderCb = cb; }

  function get() { return state; }

  function setState(patch) {
    state = Object.assign({}, state, typeof patch === "function" ? patch(state) : patch);
    persistLocal();
    if (typeof RemoteSync !== "undefined") RemoteSync.push(pick(SHARED_KEYS, state));
    if (renderCb) renderCb();
  }

  // Applied when another device pushes a change: merges only the shared data in —
  // this browser's own session (page, selection, open modal, login) is left alone —
  // and does NOT push back out, so it can't loop with RemoteSync.
  function applyRemote(sharedData) {
    const migrated = migrate(Object.assign({}, sharedData));
    Model.invalidate();
    state = Object.assign({}, state, pick(SHARED_KEYS, Object.assign(defaults(), migrated)));
    persistLocal();
    if (renderCb) renderCb();
  }

  function initRemote() {
    if (typeof RemoteSync !== "undefined") RemoteSync.init(applyRemote);
  }

  function reset() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    state = defaults();
    Model.invalidate();
    if (renderCb) renderCb();
  }

  return { load, setState, get, onChange, reset, initRemote };
})();

// Minimal hyperscript + patching DOM layer.
//
// h() builds plain vnode objects (not real DOM nodes). mount() diffs the new vnode
// tree against the previously rendered one and PATCHES the real DOM in place —
// updating only what actually changed — instead of tearing the whole page down and
// rebuilding it on every keystroke. That's what keeps focus, caret position, scroll
// position, and hover state intact while typing instead of the screen flashing.
function h(tag, props, ...children) {
  return { __vnode: true, tag, props: props || null, children: flattenChildren(children) };
}

function flattenChildren(children) {
  const out = [];
  (function walk(arr) {
    for (let i = 0; i < arr.length; i++) {
      const c = arr[i];
      if (Array.isArray(c)) walk(c);
      else if (c != null && c !== false && c !== true) out.push(c);

  })(children);
  return out;
}

function isVNode(x) { return x != null && typeof x === "object" && x.__vnode === true; }
function isTextLike(x) { return typeof x === "string" || typeof x === "number"; }

const EVENT_PROP_RE = /^on([A-Za-z].*)/;

function applyProp(el, key, value) {
  if (key === "style") {
    const s = typeof value === "string" ? value : "";
    if (s) el.setAttribute("style", s); else el.removeAttribute("style");
    return;
  }
  if (key === "className") { el.className = value || ""; return; }
  if (key === "html") { if (el.innerHTML !== value) el.innerHTML = value; return; }
  const em = EVENT_PROP_RE.exec(key);
  if (em && (typeof value === "function" || value == null)) {
    const evt = em[1].toLowerCase();
    el.__listeners = el.__listeners || {};
    if (el.__listeners[evt]) el.removeEventListener(evt, el.__listeners[evt]);
    if (typeof value === "function") { el.addEventListener(evt, value); el.__listeners[evt] = value; }
    else delete el.__listeners[evt];
    return;
  }
  if (key === "checked") { el.checked = !!value; return; }
  if (key === "value") { const v = value == null ? "" : value; if (el.value !== v) el.value = v; return; }
  if (value == null || value === false) el.removeAttribute(key);
  else el.setAttribute(key, value);
}

function removeProp(el, key) {
  const em = EVENT_PROP_RE.exec(key);
  if (em) {
    const evt = em[1].toLowerCase();
    if (el.__listeners && el.__listeners[evt]) { el.removeEventListener(evt, el.__listeners[evt]); delete el.__listeners[evt]; }
    return;
  }
  if (key === "style") { el.removeAttribute("style"); return; }
  if (key === "className") { el.className = ""; return; }
  if (key === "checked") { el.checked = false; return; }
  if (key === "value") { el.value = ""; return; }
  el.removeAttribute(key);

function createDom(vnode) {
  if (isTextLike(vnode)) return document.createTextNode(String(vnode));
  const el = document.createElement(vnode.tag);
  // Children first, then props — a <select>'s value only "sticks" once its
  // <option>s already exist, so props must be applied after children are attached.
  vnode.children.forEach(c => el.appendChild(createDom(c)));
  const props = vnode.props || {};
  for (const k in props) applyProp(el, k, props[k]);
  return el;
}

function sameType(a, b) {
  const aText = isTextLike(a), bText = isTextLike(b);
  if (aText || bText) return aText && bText;
  return isVNode(a) && isVNode(b) && a.tag === b.tag;

// Patches `domNode` (which rendered `oldVnode`) so it matches `newVnode`, reusing
// the existing node and its descendants wherever the shape allows. Returns the node
// that now represents `newVnode` at this position (usually domNode itself).
function patch(domNode, oldVnode, newVnode) {
  if (!sameType(oldVnode, newVnode)) {
    const fresh = createDom(newVnode);
    domNode.replaceWith(fresh);
    return fresh;
  }
  if (isTextLike(newVnode)) {
    const s = String(newVnode);
    if (domNode.nodeValue !== s) domNode.nodeValue = s;
    return domNode;
  }

  const oldCh = (oldVnode && oldVnode.children) || [];
  const newCh = (newVnode && newVnode.children) || [];
  const max = Math.max(oldCh.length, newCh.length);
  let cursor = domNode.firstChild;
  for (let i = 0; i < max; i++) {
    const next = cursor ? cursor.nextSibling : null;
    if (i >= newCh.length) {
      if (cursor) domNode.removeChild(cursor);
    } else if (i >= oldCh.length) {
      domNode.appendChild(createDom(newCh[i]));
    } else {
      patch(cursor, oldCh[i], newCh[i]);

    cursor = next;
  }

  const oldProps = (oldVnode && oldVnode.props) || {};
  const newProps = (newVnode && newVnode.props) || {};
  for (const k in oldProps) if (!(k in newProps)) removeProp(domNode, k);
  for (const k in newProps) if (newProps[k] !== oldProps[k] || k === "value" || k.slice(0, 2) === "on") applyProp(domNode, k, newProps[k]);

let mountedVnode = null;

function mount(root, vnode) {
  if (mountedVnode && root.firstChild) {
    patch(root.firstChild, mountedVnode, vnode);

            h("button", { onClick: u.toggle, style: "border:1px solid #dde5e2;background:#fff;padding:5px 11px;border-radius:8px;font-size:11.5px;cursor:pointer;color:#3d4b47" }, u.toggleLabel),
            h("button", { onClick: u.remove, style: "border:1px solid #f1cdc8;background:#fff;padding:5px 11px;border-radius:8px;font-size:11.5px;cursor:pointer;color:#8f231b" }, "ลบ")))
        )))
      )
    )
  );
}

// ==== js\screens\modal.js ====
function renderModal(vals) {
  if (!vals.modalOpen) return null;
  return h("div", { style: "position:fixed;inset:0;z-index:60;background:rgba(12,42,37,.45);display:flex;align-items:center;justify-content:center;padding:30px", onClick: e => { if (e.target === e.currentTarget) vals.closeModal(); } },
    h("div", { style: "background:#fff;border-radius:16px;width:560px;max-width:100%;max-height:100%;overflow:auto;box-shadow:0 24px 60px rgba(6,35,29,.28)" },
      h("div", { style: "padding:18px 22px;border-bottom:1px solid #eef2f1;display:flex;align-items:center;gap:12px" },
        h("div", { style: "flex:1" }, h("div", { style: "font-size:15px;font-weight:600" }, vals.modalTitle), h("div", { style: "font-size:11.5px;color:#5c6b67;margin-top:2px" }, vals.modalSub)),
        h("button", { onClick: vals.closeModal, style: "border:0;background:#f2f5f4;width:30px;height:30px;border-radius:9px;cursor:pointer;color:#5c6b67;font-size:15px" }, "×")
      ),
      h("div", { style: "padding:20px 22px;display:flex;flex-direction:column;gap:13px" },
        vals.modalFields.map(f => h("div", {},
          h("div", { style: "font-size:11.5px;color:#5c6b67;margin-bottom:6px" }, f.label),
          f.isSelect ? h("select", { value: f.value, onChange: f.set, style: "width:100%;padding:9px 12px;border:1px solid #dde5e2;border-radius:9px;background:#fff;outline:none" }, f.options.map(o => h("option", { value: o }, o)))
          : f.isDate ? h("input", { value: f.value, onInput: f.set, type: "date", style: "width:100%;padding:9px 12px;border:1px solid #dde5e2;border-radius:9px;outline:none" })
          : f.isFile ? h("div", {},
              h("label", { style: "display:block;width:100%;border:1px dashed #a9c4bd;background:#f7faf9;color:#0e6b5b;padding:14px;border-radius:10px;font-size:12.5px;cursor:pointer;font-weight:500;text-align:center;box-sizing:border-box" },
                f.value,
                h("input", { type: "file", onChange: f.set, style: "display:none" })
              )
            )
          : h("input", { value: f.value, onInput: f.set, placeholder: f.ph, style: "width:100%;padding:9px 12px;border:1px solid #dde5e2;border-radius:9px;outline:none" })
        )),
        h("div", { style: "display:flex;gap:9px;justify-content:flex-end;margin-top:5px" },
          h("button", { onClick: vals.closeModal, style: "border:1px solid #dde5e2;background:#fff;padding:9px 16px;border-radius:10px;font-size:12.5px;cursor:pointer;color:#3d4b47" }, "ยกเลิก"),
          h("button", { onClick: vals.modalSave, style: "border:0;background:#0e6b5b;color:#fff;padding:9px 18px;border-radius:10px;font-size:12.5px;font-weight:500;cursor:pointer" }, vals.modalCta)
        )
      )
    )
  );
}

// ==== js\render.js ====
function renderSidebar(vals) {
  return h("aside", { style: "width:254px;flex:none;background:#0c2a25;color:#cfe2dc;display:flex;flex-direction:column;position:sticky;top:0;height:100vh" },
    h("div", { style: "padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.09)" },
      h("div", { style: "display:flex;align-items:center;gap:11px" },
        h("div", { style: "width:34px;height:34px;flex:none;border-radius:9px;background:#39c1a3;color:#06231d;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;letter-spacing:-.5px" }, "ภก"),
        h("div", { style: "min-width:0" },
          h("div", { style: "font-size:13.5px;font-weight:600;color:#fff;line-height:1.25" }, "กลุ่มงานเภสัชกรรม"),
          h("div", { style: "font-size:11px;color:#7fa89f;line-height:1.3" }, "โรงพยาบาลเลิดสิน")
        )
      ),
      h("div", { style: "margin-top:14px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#5f8b82" }, "Personnel & Development")
    ),
    h("nav", { style: "flex:1;overflow:auto;padding:14px 12px" },
      vals.navGroups.map(g => h("div", { style: "margin-bottom:16px" },
        h("div", { style: "font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#5f8b82;padding:0 8px 7px" }, g.title),
        g.items.map(it => h("button", { onClick: it.go, style: "width:100%;display:flex;align-items:center;gap:9px;padding:9px 10px;margin-bottom:2px;border:0;border-radius:9px;text-align:left;cursor:pointer;font-size:13px;line-height:1.3;transition:background .15s;" + it.on },
          h("span", { style: "width:5px;height:5px;flex:none;border-radius:50%;" + it.dot }),
          h("span", { style: "flex:1" }, it.label),
          h("span", { style: "font-size:10.5px;color:#6f9b92" }, it.badge)
        ))
      ))
    ),
    h("div", { style: "padding:14px 16px;border-top:1px solid rgba(255,255,255,.09);display:flex;align-items:center;gap:10px" },
      h("div", { style: "width:32px;height:32px;flex:none;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center" }, vals.userInitials),
      h("div", { style: "min-width:0;flex:1" },
        h("div", { style: "font-size:12px;color:#fff;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" }, vals.userName),
        h("div", { style: "font-size:10.5px;color:#7fa89f" }, vals.userRole)
      ),
      h("button", { onClick: vals.logout, title: "ออกจากระบบ", style: "border:1px solid rgba(255,255,255,.16);background:transparent;color:#a8c5be;padding:6px 9px;border-radius:8px;font-size:11px;cursor:pointer;flex:none" }, "ออก")
    )
  );
}

function renderHeader(vals) {
  return h("header", { style: "position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid #dde5e2;padding:13px 30px;display:flex;align-items:center;gap:20px" },
    h("div", { style: "flex:1;min-width:0" },
      h("h1", { style: "margin:0;font-size:18px;font-weight:600;letter-spacing:-.2px" }, vals.pageTitle),
      h("div", { style: "font-size:12px;color:#5c6b67;margin-top:2px" }, vals.pageSub)
    ),
    h("div", { style: "display:flex;align-items:center;gap:9px;padding:6px 12px 6px 10px;background:#f2f5f4;border:1px solid #dde5e2;border-radius:11px" },
      h("span", { style: "width:22px;height:22px;flex:none;border-radius:7px;background:#0c2a25;color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center" }, vals.roleAbbr),
      h("span", { style: "line-height:1.25" },
        h("span", { style: "display:block;font-size:12.5px;font-weight:600" }, vals.roleLabel),
        h("span", { style: "display:block;font-size:10.5px;color:#5c6b67" }, "สิทธิ์การเข้าถึง: " + vals.roleScope)
      )
    ),
    h("div", { style: "font-size:12px;color:#5c6b67;border-left:1px solid #dde5e2;padding-left:16px;text-align:right;line-height:1.35" },
      h("div", { style: "color:#14201d;font-weight:500" }, "26 ส.ค. 2569"),
      h("div", {}, "ปีงบประมาณ 2569")
    )
  );
}

function renderApp() {
  const state = Store.get();
  const vals = VM.compute(state);
  const root = document.getElementById("root");

  if (vals.isLogin) {
    mount(root, renderLogin(vals));
    return;
  }

  const content = resolveScreen(vals);

  const shell = h("div", { style: "display:flex;min-height:100vh;align-items:stretch" },
    renderSidebar(vals),
    h("main", { style: "flex:1;min-width:0;display:flex;flex-direction:column" },
      renderHeader(vals),
      h("div", { style: "padding:24px 30px 70px;animation:fadeUp .25s ease both" }, content)
    ),
    renderModal(vals)
  );
  mount(root, shell);
}

function resolveScreen(vals) {
  if (vals.isDash) return renderDash(vals);
  if (vals.isPeople) return renderPeople(vals);
  if (vals.isPerson) return renderPerson(vals);
  if (vals.isAttend) return renderAttend(vals);
  if (vals.isIdp) return renderIdp(vals);
  if (vals.isMe) return renderMe(vals);
  if (vals.isDaily) return h("div", {}, renderAdmBanner(vals), renderDaily(vals));
  if (vals.isAppr) return h("div", {}, renderAdmBanner(vals), renderAppr(vals));
  if (vals.isRoster) return h("div", {}, renderAdmBanner(vals), renderRoster(vals));
  if (vals.isAlumni) return h("div", {}, renderAdmBanner(vals), renderAlumni(vals));
  if (vals.isLeaveReport) return h("div", {}, renderAdmBanner(vals), renderLeaveReport(vals));
  if (vals.isAdmPeople) return h("div", {}, renderAdmBanner(vals), renderAdmPeople(vals));
  if (vals.isAdmConf) return h("div", {}, renderAdmBanner(vals), renderAdmConf(vals));
  if (vals.isAdmTarget) return h("div", {}, renderAdmBanner(vals), renderAdmTarget(vals));
  if (vals.isAdmUser) return h("div", {}, renderAdmBanner(vals), renderAdmUser(vals));
  return h("div", {}, "หน้านี้ยังไม่พร้อมใช้งาน");
}

// ==== js\main.js ====
Store.onChange(renderApp);
Store.load();
renderApp();
Store.initRemote();

</script>

</html>
